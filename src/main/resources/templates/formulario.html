<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${titulo}">Empleado</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><div class="layout"><aside class="sidebar"><div class="brand"><span class="brand-icon">SE</span><div><b>Empleados</b><small>Panel de administración</small></div></div><nav><a href="/">▦ &nbsp; Dashboard</a><a href="/">♙ &nbsp; Empleados</a><a class="active" href="/nuevo">＋ &nbsp; Registrar empleado</a></nav><div class="side-bottom">Sistema de gestión<br><small>Versión Web 1.0</small></div></aside><main><header><div><p class="eyebrow">EMPLEADOS</p><h1 th:text="${titulo}">Registrar empleado</h1><p class="subtitle">Ingresá los datos del empleado.</p></div><a class="secondary" href="/">← Volver</a></header><div class="panel form-panel"><form th:if="${empleado.idEmpleado == null}" action="/guardar" method="post" th:object="${empleado}"><div class="form-grid"><label>Nombre<input required th:field="*{nombre}" placeholder="Nombre"></label><label>Apellido<input required th:field="*{apellido}" placeholder="Apellido"></label><label>Cargo<input th:field="*{cargo}" placeholder="Cargo"></label><label>Departamento<input th:field="*{departamento}" placeholder="Departamento"></label><label>Salario (L.)<input type="number" min="0" step="0.01" required th:field="*{salario}"></label><label>Estado<select th:field="*{estado}"><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option></select></label></div><div class="form-actions"><a class="secondary" href="/">Cancelar</a><button class="primary">Guardar empleado</button></div></form><form th:if="${empleado.idEmpleado != null}" action="/actualizar" method="post" th:object="${empleado}"><input type="hidden" th:field="*{idEmpleado}"><div class="form-grid"><label>Nombre<input required th:field="*{nombre}"></label><label>Apellido<input required th:field="*{apellido}"></label><label>Cargo<input th:field="*{cargo}"></label><label>Departamento<input th:field="*{departamento}"></label><label>Salario (L.)<input type="number" min="0" step="0.01" required th:field="*{salario}"></label><label>Estado<select th:field="*{estado}"><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option></select></label></div><div class="form-actions"><a class="secondary" href="/">Cancelar</a><button class="primary">Actualizar</button></div></form></div></main></div></body></html>
